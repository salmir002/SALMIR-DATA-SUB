<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SALMIR DATA SUB</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      color: #102b55;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68758a;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #26364d;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dce7;
      border-radius: 7px;
      outline: none;
    }

    input:focus {
      border-color: #1769aa;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 23px;
      border: none;
      border-radius: 7px;
      background: #102b55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #1769aa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>SALMIR DATA SUB</h1>
    <p class="subtitle">Create your account</p>

    <form id="registerForm">

      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter your full name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="08012345678" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" minlength="8" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Enter password again" required>

      <button type="submit">Create Account</button>
    </form>

    <p class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <p style="text-align:center">
      <a href="index.html">Back to Home</a>
    </p>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Your passwords do not match.");
        return;
      }

      alert("Registration system is being connected. Please try again later.");
    });
  </script>

</body>
</html>
