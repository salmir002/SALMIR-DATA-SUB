<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wallet | SALMIR DATA SUB</title>  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5fb;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      text-align: center;
      color: #102b55;
    }

    .balance {
      background: #102b55;
      color: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin: 25px 0;
    }

    .balance h2 {
      font-size: 30px;
      margin: 10px 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dce7;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #102b55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .history {
      margin-top: 30px;
      padding: 15px;
      background: #f1f5fb;
      border-radius: 8px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #1769aa;
    }
  </style></head><body><div class="container">  <h1>SALMIR DATA SUB</h1>
  <p style="text-align:center;color:#68758a;">
    Manage Your Wallet
  </p>  <div class="balance">
    <p>Available Balance</p>
    <h2>₦0.00</h2>
  </div>  <form id="fundForm"><label for="amount">Enter Deposit Amount</label>

<input
  type="number"
  id="amount"
  placeholder="Enter amount in Naira"
  min="100"
  required
>

<button type="submit">Continue to Payment</button>

  </form>  <div class="history">
    <h3>Transaction History</h3>
    <p>No transactions yet.</p>
  </div>  <a href="dashboard.html" class="back">
    ← Back to Dashboard
  </a></div><script>
  document.getElementById("fundForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const amount = Number(
        document.getElementById("amount").value
      );

      if (amount < 100) {
        alert("Minimum deposit is ₦100.");
        return;
      }

      alert(
        "Payment system is not connected yet. Your wallet has not been funded."
      );

    });
</script></body>
</html>
