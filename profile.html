<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | SALMIR DATA SUB</title>  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5fb;
      padding: 20px;
    }

    .container {
      background: white;
      max-width: 450px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      color: #102b55;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #68758a;
    }

    .profile-icon {
      width: 90px;
      height: 90px;
      background: #102b55;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
      margin: 25px auto;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #26364d;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dce7;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #102b55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1769aa;
      text-decoration: none;
    }
  </style></head><body><div class="container">  <h1>SALMIR DATA SUB</h1>  <p class="subtitle">My Account Profile</p>  <div class="profile-icon">👤</div>  <form id="profileForm"><label for="fullname">Full Name</label>
<input type="text" id="fullname" placeholder="Enter your full name" required>

<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number" maxlength="11" required>

<button type="submit">Save Changes</button>

  </form><button onclick="changePassword()">Change Password</button>

  <a href="dashboard.html" class="back">
    ← Back to Dashboard
  </a></div><script>
  document.getElementById("profileForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      alert("Profile system will be connected to the database soon.");

    });

  function changePassword() {
    alert("Password change feature will be connected soon.");
  }
</script></body>
    </html>
